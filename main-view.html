<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词</title>
  <link rel="stylesheet" href="main-view.css">
  <script src="main-view.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>提示词</h1>
      <button id="add" class="primary" disabled>新增提示词</button>
    </header>
    <p id="status" role="status">正在读取提示词…</p>
    <p id="empty" hidden>还没有提示词。点「新增提示词」保存第一条。</p>
    <ul id="list" aria-label="已保存的提示词"></ul>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <h2 id="editor-title"></h2>
      <label>标题<input id="title" type="text" maxlength="120" required autofocus></label>
      <label>正文<textarea id="body" rows="9" required></textarea></label>
      <p class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="cancel">取消</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="remove" aria-labelledby="remove-title">
    <form id="remove-form">
      <h2 id="remove-title">删除提示词？</h2>
      <p id="remove-description"></p>
      <p class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="cancel" autofocus>取消</button>
        <button type="submit" class="danger">删除</button>
      </div>
    </form>
  </dialog>

  <template id="row">
    <li>
      <h2></h2>
      <p class="preview"></p>
      <div class="actions">
        <button type="button" class="primary copy">复制</button>
        <button type="button" class="edit">编辑</button>
        <button type="button" class="delete">删除</button>
      </div>
    </li>
  </template>
</body>
</html>
